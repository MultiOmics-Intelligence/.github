.mi .a-flow{animation:mi-flow var(--T,1.6s) linear infinite}.mi .a-bob{animation:mi-bob var(--T,3s) ease-in-out infinite}
.mi .a-float{animation:mi-float var(--T,3s) ease-in var(--d,0s) infinite}.mi .a-trav{animation:mi-trav var(--T,4s) linear var(--d,0s) infinite}
.mi .l{transform-box:fill-box;transform-origin:0 50%}
@keyframes mi-growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.mi .a-growx{animation:mi-growx .9s cubic-bezier(.2,.75,.15,1) var(--d,0s) both}
@keyframes mi-fadein{from{opacity:0}to{opacity:1}}.mi .a-fadein{animation:mi-fadein .6s ease-out var(--d,0s) both}
.mi .tx{fill:var(--s1);font-family:Schibsted Grotesk,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-weight:600}
.mi .st1{stroke:var(--t1)}.mi .st2{stroke:var(--s1)}.mi .st3{stroke:var(--s2)}
