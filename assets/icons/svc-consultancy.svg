<svg xmlns="http://www.w3.org/2000/svg" class="mi" viewBox="0 0 400 300" x="13" y="13" width="69" height="69" fill="none" role="img" aria-labelledby="t d"><title id="t">Consultancy</title><desc id="d">A question moving along an agreed path, with evidence accumulating beneath it, to a clear decision. Illustrative.</desc><style>svg.mi{--t1:#FFFFFF;--t2:#8FA6F0;--s1:#DCE4FF;--s2:#8FA6F0;--ac:#5FD3B4}
.mi .bf{fill:url(#lt-card-consultancy-mint)}.mi .bs{fill:url(#ls-card-consultancy-mint)}.mi .ba{fill:url(#la-card-consultancy-mint)}.mi .ac{fill:var(--ac)}.mi .as{stroke:var(--ac)}
.mi .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}.mi .b{transform-box:fill-box;transform-origin:50% 100%}.mi .c{transform-box:fill-box;transform-origin:50% 50%}.mi .o{transform-box:view-box}
@keyframes mi-rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes mi-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.9)}}
@keyframes mi-wave{0%,100%{transform:scaleY(.15)}50%{transform:scaleY(1)}}@keyframes mi-glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes mi-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes mi-draw{0%{stroke-dashoffset:1;opacity:1}55%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes mi-spin{to{transform:rotate(360deg)}}@keyframes mi-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes mi-ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2);opacity:0}}@keyframes mi-flow{to{stroke-dashoffset:-10}}
@keyframes mi-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--dy,-2px))}}
@keyframes mi-float{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
@keyframes mi-trav{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
.mi .a-rise{animation:mi-rise .9s cubic-bezier(.2,.75,.15,1) var(--d,0s) both,mi-breathe var(--T,3.6s) ease-in-out calc(var(--d,0s) + .9s) infinite}
