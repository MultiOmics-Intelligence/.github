<svg xmlns="http://www.w3.org/2000/svg" class="mi" viewBox="0 0 64 64" x="10" y="10" width="52" height="52" fill="none" role="img" aria-labelledby="t d"><title id="t">Biomarker discovery</title><desc id="d">One signal standing out from the rest.</desc><style>svg.mi{--mi-a:#DCE4FF;--mi-b:#8FA6F0;--mi-c:#FFFFFF} .mi .fa{fill:var(--mi-a)}.mi .fb{fill:var(--mi-b)}.mi .fc{fill:var(--mi-c)} .mi .sa{stroke:var(--mi-a)}.mi .sb{stroke:var(--mi-b)}.mi .sc{stroke:var(--mi-c)} .mi .ln{fill:none;stroke-linecap:round;stroke-linejoin:round} .mi .b{transform-box:fill-box;transform-origin:50% 100%} .mi .c{transform-box:fill-box;transform-origin:50% 50%} .mi .s{transform:scaleY(var(--s,1))} @keyframes mi-rise{from{transform:scaleY(0)}to{transform:scaleY(1)}} @keyframes mi-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.86)}} @keyframes mi-wave{0%,100%{transform:scaleY(.12)}50%{transform:scaleY(1)}} @keyframes mi-glow{0%,100%{opacity:.35}50%{opacity:1}} @keyframes mi-draw{0%{stroke-dashoffset:1;opacity:1}55%{stroke-dashoffset:0;opacity:1}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}} @keyframes mi-spin{to{transform:rotate(360deg)}} @keyframes mi-ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}} @keyframes mi-float{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-14px);opacity:0}} .mi .a-rise{animation:mi-rise .9s cubic-bezier(.2,.75,.15,1) var(--d,0s) both,mi-breathe 3.4s ease-in-out calc(var(--d,0s) + .9s) infinite} .mi .a-wave{animation:mi-wave var(--T,2.4s) ease-in-out var(--d,0s) infinite} .mi .a-glow{animation:mi-glow var(--T,2.6s) ease-in-out var(--d,0s) infinite} .mi .a-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:mi-draw var(--T,3s) ease-in-out var(--d,0s) infinite} .mi .a-spin{animation:mi-spin var(--T,40s) linear infinite} .mi .a-ring{animation:mi-ring 2.2s ease-out var(--d,0s) infinite} .mi .a-float{animation:mi-float var(--T,3s) ease-in var(--d,0s) infinite} @media (prefers-reduced-motion:reduce){.mi *{animation:none!important}.mi .a-draw{stroke-dasharray:none;stroke-dashoffset:0}}</style><rect x="6.8" y="44" width="2.4" height="10" rx="1.2" class="fa b a-rise " style="--d:0s;opacity:0.6;"/><rect x="10.8" y="38" width="2.4" height="16" rx="1.2" class="fa b a-rise " style="--d:0.05s;opacity:0.6;"/><rect x="14.8" y="42" width="2.4" height="12" rx="1.2" class="fa b a-rise " style="--d:0.1s;opacity:0.6;"/><rect x="18.8" y="32" width="2.4" height="22" rx="1.2" class="fa b a-rise " style="--d:0.15s;opacity:0.6;"/><rect x="22.8" y="40" width="2.4" height="14" rx="1.2" class="fa b a-rise " style="--d:0.2s;opacity:0.6;"/><rect x="26.8" y="36" width="2.4" height="18" rx="1.2" class="fa b a-rise " style="--d:0.25s;opacity:0.6;"/><rect x="30.8" y="28" width="2.4" height="26" rx="1.2" class="fa b a-rise " style="--d:0.3s;opacity:0.6;"/><rect x="34.8" y="42" width="2.4" height="12" rx="1.2" class="fa b a-rise " style="--d:0.35s;opacity:0.6;"/><rect x="38.8" y="12" width="2.4" height="42" rx="1.2" class="fc b a-rise " style="--d:0.4s;"/><rect x="42.8" y="34" width="2.4" height="20" rx="1.2" class="fa b a-rise " style="--d:0.45s;opacity:0.6;"/><rect x="46.8" y="40" width="2.4" height="14" rx="1.2" class="fa b a-rise " style="--d:0.5s;opacity:0.6;"/><rect x="50.8" y="30" width="2.4" height="24" rx="1.2" class="fa b a-rise " style="--d:0.55s;opacity:0.6;"/><rect x="54.8" y="38" width="2.4" height="16" rx="1.2" class="fa b a-rise " style="--d:0.6s;opacity:0.6;"/><circle cx="40" cy="12" r="7" class="ln sc c a-ring --d:0.8s;" stroke-width="1.4" opacity="0.9"/><circle cx="40" cy="12" r="2" class="fc " opacity="1"/></svg></svg>