<svg xmlns="http://www.w3.org/2000/svg" class="mi" viewBox="0 0 64 64" x="10" y="10" width="52" height="52" fill="none" role="img" aria-labelledby="t d"><title id="t">AI and machine learning</title><desc id="d">A small neural network drawn with bars.</desc><style>svg.mi{--mi-a:#DCE4FF;--mi-b:#8FA6F0;--mi-c:#FFFFFF} .mi .fa{fill:var(--mi-a)}.mi .fb{fill:var(--mi-b)}.mi .fc{fill:var(--mi-c)} .mi .sa{stroke:var(--mi-a)}.mi .sb{stroke:var(--mi-b)}.mi .sc{stroke:var(--mi-c)} .mi .ln{fill:none;stroke-linecap:round;stroke-linejoin:round} .mi .b{transform-box:fill-box;transform-origin:50% 100%} .mi .c{transform-box:fill-box;transform-origin:50% 50%} .mi .s{transform:scaleY(var(--s,1))} @keyframes mi-rise{from{transform:scaleY(0)}to{transform:scaleY(1)}} @keyframes mi-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.86)}} @keyframes mi-wave{0%,100%{transform:scaleY(.12)}50%{transform:scaleY(1)}} @keyframes mi-glow{0%,100%{opacity:.35}50%{opacity:1}} @keyframes mi-draw{0%{stroke-dashoffset:1;opacity:1}55%{stroke-dashoffset:0;opacity:1}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}} @keyframes mi-spin{to{transform:rotate(360deg)}} @keyframes mi-ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}} @keyframes mi-float{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-14px);opacity:0}} .mi .a-rise{animation:mi-rise .9s cubic-bezier(.2,.75,.15,1) var(--d,0s) both,mi-breathe 3.4s ease-in-out calc(var(--d,0s) + .9s) infinite} .mi .a-wave{animation:mi-wave var(--T,2.4s) ease-in-out var(--d,0s) infinite} .mi .a-glow{animation:mi-glow var(--T,2.6s) ease-in-out var(--d,0s) infinite} .mi .a-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:mi-draw var(--T,3s) ease-in-out var(--d,0s) infinite} .mi .a-spin{animation:mi-spin var(--T,40s) linear infinite} .mi .a-ring{animation:mi-ring 2.2s ease-out var(--d,0s) infinite} .mi .a-float{animation:mi-float var(--T,3s) ease-in var(--d,0s) infinite} @media (prefers-reduced-motion:reduce){.mi *{animation:none!important}.mi .a-draw{stroke-dasharray:none;stroke-dashoffset:0}}</style><line x1="12" y1="17" x2="32" y2="12" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="12" y1="17" x2="32" y2="24" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="12" y1="17" x2="32" y2="40" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="12" y1="17" x2="32" y2="52" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="12" y1="32" x2="32" y2="12" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="12" y1="32" x2="32" y2="24" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="12" y1="32" x2="32" y2="40" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="12" y1="32" x2="32" y2="52" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="12" y1="47" x2="32" y2="12" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="12" y1="47" x2="32" y2="24" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="12" y1="47" x2="32" y2="40" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="12" y1="47" x2="32" y2="52" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="32" y1="12" x2="52" y2="23" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="32" y1="12" x2="52" y2="41" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="32" y1="24" x2="52" y2="23" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="32" y1="24" x2="52" y2="41" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="32" y1="40" x2="52" y2="23" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="32" y1="40" x2="52" y2="41" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="32" y1="52" x2="52" y2="23" class="ln sb" stroke-width="0.7" opacity="0.28" /><line x1="32" y1="52" x2="52" y2="41" class="ln sb" stroke-width="0.7" opacity="0.28" /><rect x="10.8" y="10" width="2.4" height="14" rx="1.2" class="fa c a-glow " style="--d:0s;--T:2.4s;"/><rect x="10.8" y=